<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Solivage Travels</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 20px 40px;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .admin-header h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.8rem;
        }
        
        .admin-logout {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .admin-logout:hover {
            background: var(--primary);
            color: var(--bg-dark);
        }
        
        .admin-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
        }
        
        .admin-tab {
            padding: 14px 28px;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .admin-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--bg-dark);
        }
        
        .admin-tab:hover:not(.active) {
            border-color: var(--primary);
        }
        
        .admin-content {
            display: none;
        }
        
        .admin-content.active {
            display: block;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: var(--bg-card);
            padding: 24px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .stat-card h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-card .number {
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--primary);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
        }
        
        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        th {
            background: rgba(201, 168, 108, 0.1);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }
        
        td {
            font-size: 0.95rem;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 2px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .status-pending {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }
        
        .status-confirmed {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }
        
        .status-completed {
            background: rgba(96, 165, 250, 0.2);
            color: #60a5fa;
        }
        
        .status-cancelled {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
        }
        
        .action-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: var(--text);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            margin-right: 8px;
        }
        
        .action-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .action-btn.delete:hover {
            border-color: var(--error);
            color: var(--error);
        }
        
        .rates-form {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
        }
        
        .rates-form .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-form {
            background: var(--bg-card);
            padding: 50px 40px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 400px;
            width: 100%;
        }
        
        .login-form h2 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-form .form-group {
            margin-bottom: 20px;
        }
        
        .login-form label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        
        .login-form input {
            width: 100%;
            padding: 14px;
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: var(--text);
        }
        
        .login-form button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            border: none;
            border-radius: 4px;
            color: var(--bg-dark);
            font-weight: 500;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="loginPage" class="login-container">
        <form id="loginForm" class="login-form">
            <h2>Admin Login</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>
    </div>

    <div id="adminPage" class="admin-container" style="display: none;">
        <div class="admin-header">
            <h1>Solivage Travels Admin</h1>
            <button class="admin-logout" onclick="logout()">Logout</button>
        </div>

        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="bookings">Bookings</button>
            <button class="admin-tab" data-tab="contacts">Messages</button>
            <button class="admin-tab" data-tab="rates">Rates</button>
        </div>

        <div id="bookings" class="admin-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Bookings</h3>
                    <div class="number" id="totalBookings">0</div>
                </div>
                <div class="stat-card">
                    <h3>Pending</h3>
                    <div class="number" id="pendingBookings">0</div>
                </div>
                <div class="stat-card">
                    <h3>Confirmed</h3>
                    <div class="number" id="confirmedBookings">0</div>
                </div>
                <div class="stat-card">
                    <h3>Completed</h3>
                    <div class="number" id="completedBookings">0</div>
                </div>
                <div class="stat-card">
                    <h3>Cancelled</h3>
                    <div class="number" id="cancelledBookings">0</div>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Vehicle</th>
                        <th>Service</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="bookingsTable"></tbody>
            </table>
        </div>

        <div id="contacts" class="admin-content">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Message</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="contactsTable"></tbody>
            </table>
        </div>

        <div id="rates" class="admin-content">
            <form id="ratesForm" class="rates-form">
                <h3 style="margin-bottom: 20px;">Update Pricing</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Vehicle</label>
                        <select id="rateVehicle">
                            <option value="electric">Electric Class</option>
                            <option value="executive">Executive Class</option>
                            <option value="chauffeur">Chauffeur Class</option>
                            <option value="xl">Chauffeur XL</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Service</label>
                        <select id="rateService">
                            <option value="hourly">Hourly</option>
                            <option value="oneway">One Way</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price (KES)</label>
                        <input type="number" id="ratePrice" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Update Rate</button>
            </form>
            
            <div style="margin-top: 30px;">
                <h3>Current Rates</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Vehicle</th>
                            <th>Service</th>
                            <th>Price (KES)</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ratesTable"></tbody>
                </table>
            </div>
            
            <div style="margin-top: 30px;">
                <h3>Upload Vehicle Images</h3>
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Vehicle Type</label>
                            <select id="uploadVehicleType">
                                <option value="electric">Electric Class</option>
                                <option value="executive">Executive Class</option>
                                <option value="chauffeur">Chauffeur Class</option>
                                <option value="xl">Chauffeur XL</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Image File</label>
                            <input type="file" id="uploadImage" accept="image/*" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload Image</button>
                </form>
                <div id="uploadResult" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('adminToken');
        
        if (token) {
            showAdmin();
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            
            if (res.ok) {
                const data = await res.json();
                token = data.token;
                localStorage.setItem('adminToken', token);
                showAdmin();
            } else {
                alert('Invalid credentials');
            }
        });
        
        function showAdmin() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPage').style.display = 'block';
            loadData();
        }
        
        async function loadData() {
            const auth = { headers: { 'Authorization': `Bearer ${token}` } };
            
            const bookingsRes = await fetch('/api/bookings');
            const bookings = await bookingsRes.json();
            
            document.getElementById('totalBookings').textContent = bookings.length;
            document.getElementById('pendingBookings').textContent = bookings.filter(b => b.status === 'pending').length;
            document.getElementById('confirmedBookings').textContent = bookings.filter(b => b.status === 'confirmed').length;
            document.getElementById('completedBookings').textContent = bookings.filter(b => b.status === 'completed').length;
            document.getElementById('cancelledBookings').textContent = bookings.filter(b => b.status === 'cancelled').length;
            
            const bookingsTable = document.getElementById('bookingsTable');
            bookingsTable.innerHTML = bookings.map(b => `
                <tr>
                    <td>${b.id}</td>
                    <td>${b.name}<br><small style="color: var(--text-muted)">${b.email}</small></td>
                    <td>${b.vehicle}</td>
                    <td>${b.service}</td>
                    <td>${new Date(b.date).toLocaleDateString()}</td>
                    <td><span class="status-badge status-${b.status}">${b.status}</span></td>
                    <td>
                        <button class="action-btn" onclick="updateStatus(${b.id}, 'confirmed')" ${b.status !== 'pending' ? 'disabled' : ''}>Confirm</button>
                        <button class="action-btn" onclick="updateStatus(${b.id}, 'completed')" ${b.status !== 'confirmed' ? 'disabled' : ''}>Complete</button>
                        <button class="action-btn" onclick="updateStatus(${b.id}, 'cancelled')" ${b.status === 'completed' || b.status === 'cancelled' ? 'disabled' : ''}>Cancel</button>
                        <button class="action-btn delete" onclick="deleteBooking(${b.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
            
            const contactsRes = await fetch('/api/contacts', auth);
            const contacts = await contactsRes.json();
            
            const contactsTable = document.getElementById('contactsTable');
            contactsTable.innerHTML = contacts.map(c => `
                <tr>
                    <td>${c.id}</td>
                    <td>${c.name}</td>
                    <td>${c.email}</td>
                    <td>${c.message.substring(0, 50)}...</td>
                    <td>${new Date(c.created_at).toLocaleDateString()}</td>
                    <td><span class="status-badge status-${c.status}">${c.status}</span></td>
                    <td>
                        <button class="action-btn" onclick="updateContactStatus(${c.id}, 'read')" ${c.status !== 'unread' ? 'disabled' : ''}>Mark as Read</button>
                        <button class="action-btn delete" onclick="deleteContact(${c.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
            
            // Load rates
            const ratesRes = await fetch('/api/rates', auth);
            const rates = await ratesRes.json();
            window.currentRates = rates; // Store globally for edit function
            
            const ratesTable = document.getElementById('ratesTable');
            if (ratesTable) {
                ratesTable.innerHTML = rates.map(r => `
                    <tr>
                        <td>${r.vehicle}</td>
                        <td>${r.service}</td>
                        <td>KES ${r.base_price.toLocaleString()}</td>
                        <td>
                            <button class="action-btn" onclick="editRate(${r.id})">Edit</button>
                            <button class="action-btn delete" onclick="deleteRate(${r.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            }
        }
        
        async function updateStatus(id, status) {
            await fetch(`/api/bookings/${id}`, {
                method: 'PATCH',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ status })
            });
            loadData();
        }
        
        async function deleteBooking(id) {
            if (confirm('Delete this booking?')) {
                await fetch(`/api/bookings/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                loadData();
            }
        }
        
        async function updateContactStatus(id, status) {
            await fetch(`/api/contacts/${id}`, {
                method: 'PATCH',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ status })
            });
            loadData();
        }
        
        async function deleteContact(id) {
            if (confirm('Delete this contact message?')) {
                await fetch(`/api/contacts/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                loadData();
            }
        }
        
        async function editRate(id) {
            // Find the rate in the current rates array
            const rate = window.currentRates?.find(r => r.id === id);
            if (!rate) return;
            
            const vehicle = prompt('Enter vehicle type:', rate.vehicle);
            if (vehicle === null) return;
            
            const service = prompt('Enter service type (hourly/oneway):', rate.service);
            if (service === null) return;
            
            const price = prompt('Enter price (KES):', rate.base_price);
            if (price === null) return;
            
            await fetch(`/api/rates/${id}`, {
                method: 'PATCH',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ vehicle, service, base_price: parseFloat(price) })
            });
            loadData();
        }
        
        async function deleteRate(id) {
            if (confirm('Delete this rate?')) {
                await fetch(`/api/rates/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                loadData();
            }
        }
        
        document.querySelectorAll('.admin-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.admin-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });
        
        function logout() {
            localStorage.removeItem('adminToken');
            location.reload();
        }
        
        // File upload functionality
        document.addEventListener('DOMContentLoaded', function() {
            const uploadForm = document.getElementById('uploadForm');
            const uploadResult = document.getElementById('uploadResult');
            
            if (uploadForm && uploadResult) {
                uploadForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const formData = new FormData();
                    formData.append('image', document.getElementById('uploadImage').files[0]);
                    formData.append('vehicleType', document.getElementById('uploadVehicleType').value);
                    
                    try {
                        const res = await fetch('/api/upload', {
                            method: 'POST',
                            headers: { 
                                'Authorization': `Bearer ${localStorage.getItem('adminToken')}` 
                            },
                            body: formData
                        });
                        
                        if (res.ok) {
                            const data = await res.json();
                            uploadResult.innerHTML = `
                                <div style="background-color: rgba(74, 222, 128, 0.2); padding: 15px; border-radius: 4px;">
                                    <h4>Upload Successful!</h4>
                                    <p>Filename: ${data.filename}</p>
                                    <p>Path: ${data.path}</p>
                                    <img src="${data.path}" alt="Uploaded" style="max-width: 200px; margin-top: 10px;">
                                </div>
                            `;
                        } else {
                            const error = await res.json();
                            uploadResult.innerHTML = `
                                <div style="background-color: rgba(248, 113, 113, 0.2); padding: 15px; border-radius: 4px;">
                                    <h4>Upload Failed</h4>
                                    <p>${error.error || 'Unknown error'}</p>
                                </div>
                            `;
                        }
                    } catch (err) {
                        console.error(err);
                        uploadResult.innerHTML = `
                            <div style="background-color: rgba(248, 113, 113, 0.2); padding: 15px; border-radius: 4px;">
                                <h4>Upload Error</h4>
                                <p>An error occurred during upload.</p>
                            </div>
                        `;
                    }
                });
            }
        });
    </script>
</body>
</html>
